services:

  desnz-syeia-appdb:
    image: postgres:15-alpine
    container_name: desnz-syeia-appdb
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - desnz-syeia-network

  ministack:
    image: ministackorg/ministack:latest
    container_name: ministack
    ports:
      - "4566:4566"
    environment:
      MINISTACK_REGION: eu-west-2
      MINISTACK_ACCOUNT_ID: "000000000000"
      LOG_LEVEL: INFO
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4566/_ministack/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - desnz-syeia-network

  desnz-syeia-inbound-receiver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desnz-syeia-inbound-receiver
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: local
      PORT: 3001
      HOST: "0.0.0.0"
      LOG_LEVEL: debug

      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      SSLMODE: disable

      AWS_REGION: eu-west-2
      AWS_ENDPOINT: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PAYMENT_WEBHOOK_QUEUE_URL: http://ministack:4566/000000000000/payment-webhook-queue
      SQS_ENABLED: "true"

      GOVPAY_WEBHOOK_SIGNING_KEY: dev-signing-key-change-in-production
      GOVPAY_API_KEY: dev-api-key-change-in-production

      SIGNATURE_VERIFICATION_ENABLED: "true"
      DETAILED_LOGGING: "true"

    depends_on:
      ministack:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3001/health',(r)=>{process.exit(r.statusCode===200?0:1)})"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - desnz-syeia-network

  desnz-syeia-lambda-register:
    build:
      context: .
      dockerfile: localstack-init/Dockerfile
    container_name: desnz-syeia-lambda-register
    volumes:
      - ../DESNZ-SYEIA-Lambdas/pay-callback-reconciler:/lambda-src/reconciler:ro
      - ../DESNZ-SYEIA-Lambdas/pay-callback-relay:/lambda-src/relay:ro
    depends_on:
      ministack:
        condition: service_healthy
    environment:
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://ministack:4566

      PGHOST: host.docker.internal
      PGPORT: "5432"
      PGDATABASE: appdb
      PGUSER: postgres
      PGPASSWORD: postgres
      WEBHOOK_SQS_QUEUE_URL: http://ministack:4566/000000000000/payment-webhook-queue
      GOVUK_PAY_WEBHOOK_SECRET: dev-signing-key-change-in-production
      ECS_CLUSTER_ARN: arn:aws:ecs:eu-west-2:000000000000:cluster/local
      ECS_WEBHOOK_TASK_DEFINITION: arn:aws:ecs:eu-west-2:000000000000:task-definition/local:1

      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      SSLMODE: disable
      SQS_QUEUE_URL: http://ministack:4566/000000000000/payment-webhook-queue
    restart: "no"
    networks:
      - desnz-syeia-network

volumes:
  postgres-data:
    driver: local

networks:
  desnz-syeia-network:
    driver: bridge
