# LocalStack Configuration for Local AWS Testing
# This allows you to test SQS integration without real AWS credentials

version: '3.8'

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack-sqs
    ports:
      - "4566:4566"            # LocalStack gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      - SERVICES=sqs            # Only enable SQS service
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DEFAULT_REGION=eu-west-2
    volumes:
      - "./localstack-init:/etc/localstack/init/ready.d"  # Init scripts
      - localstack-data:/tmp/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"

volumes:
  localstack-data:
